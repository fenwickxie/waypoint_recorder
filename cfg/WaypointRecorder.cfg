#!/usr/bin/env python
PACKAGE = "waypoint_recorder"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

gen.add("odomTopic", str_t, 0, "里程计输入话题", "/state_estimation")
gen.add("pointGoalTopic", str_t, 0, "PointStamped 目标话题", "/way_point")
gen.add("publishPointGoal", bool_t, 0, "发布 PointStamped 目标", True)
gen.add("poseGoalTopic", str_t, 0, "PoseStamped 目标话题", "/move_base_simple/goal")
gen.add("publishPoseGoal", bool_t, 0, "发布 PoseStamped 目标", True)
gen.add("speedTopic", str_t, 0, "速度话题", "/speed")
gen.add("publishSpeed", bool_t, 0, "发布速度指令", True)
gen.add("speedValue", double_t, 0, "导航目标速度", 1.0, 0.0, 20.0)
gen.add("frameId", str_t, 0, "目标和标记使用的坐标系", "map")

gen.add("arrivalRadius", double_t, 0, "航点到达水平距离阈值（米）", 0.5, 0.0, 100.0)
gen.add("zBound", double_t, 0, "航点到达高度容差（米）", 2.0, 0.0, 100.0)
gen.add("enableEarlySwitch", bool_t, 0, "启用提前切换航点", True)
gen.add("earlySwitchRadius", double_t, 0, "提前切换距离阈值（米）", 1.2, 0.0, 100.0)
gen.add("waitTime", double_t, 0, "到达航点后的等待时间（秒）", 0.0, 0.0, 3600.0)
gen.add("loopNavigation", bool_t, 0, "循环导航航点", False)
gen.add("controlRate", double_t, 0, "节点控制循环频率（Hz）", 20.0, 1.0, 200.0)

gen.add("distanceInterval", double_t, 0, "按距离自动录制间隔（米）", 1.0, 0.001, 10000.0)
gen.add("timeInterval", double_t, 0, "按时间自动录制间隔（秒）", 1.0, 0.001, 3600.0)
gen.add("recordStartPoint", bool_t, 0, "自动录制开始时记录起点", False)

gen.add("commandTopic", str_t, 0, "控制命令话题", "/waypoint_recorder/command")
gen.add("statusTopic", str_t, 0, "状态话题", "/waypoint_recorder/status")
gen.add("markerTopic", str_t, 0, "航点标记话题", "/waypoint_recorder/markers")
gen.add("defaultFilePath", str_t, 0, "默认航点文件路径", "")

exit(gen.generate(PACKAGE, "waypoint_node", "WaypointRecorder"))
