# ==============================================================================
# Waypoint Recorder & Auto-Publisher Configuration
# 该配置文件解耦于特定机器人平台，可移植至任意ROS 1项目进行目标点录制与自动发布
# ==============================================================================

# 话题与坐标系配置
topics:
  # 里程计输入话题（当前机器人位姿反馈）
  # 在当前工作空间仿真中通常为 /state_estimation，在其他通用ROS项目中可配置为 /odom
  odom_topic: "/odin1/odometry"

  # 局部规划器目标点话题（geometry_msgs/PointStamped）
  # 对应当前工作空间中 local_planner 的输入目标点话题
  point_goal_topic: "/way_point"
  publish_point_goal: true

  # 通用导航目标话题（geometry_msgs/PoseStamped）
  # 兼容 move_base、navigation stack 等标准ROS组件
  pose_goal_topic: "/move_base_simple/goal"
  publish_pose_goal: true

  # 速度控制 / 导航触发话题（std_msgs/Float32）
  speed_topic: "/speed"
  publish_speed: true
  speed_value: 2.0

  # 坐标系名称，通常为 map 或 odom
  frame_id: "map"

# 自动录制参数（d 按距离开始，f 按时间开始，e 结束并补录终点）
recording:
  # 是否在开始自动录制时立即记录起点；关闭时达到距离/时间间隔后才记录首点
  record_start_point: false
  # 累计相邻里程计三维路程达到此值时录制，必须为有限正数（米）
  distance_interval: 3.0
  # ROS 时间间隔，收到新里程计且达到此值时录制，必须为有限正数（秒）
  time_interval: 3.0

# 导航与到达判定参数
navigation:
  # 最终到达目标点的水平判定半径（米）
  arrival_radius: 0.5

  # 高度差判定阈值（米）
  z_bound: 2.0

  # 提前发布下一个目标点的开关（用于避免小车在中间目标点减速顿挫，使运动顺滑）
  enable_early_switch: false

  # 提前发布目标点的距离阈值（米），需大于 arrival_radius
  # 当机器人距离当前目标点小于该阈值时，直接提前发布下一个目标点
  early_switch_radius: 1.2

  # 到达非提前切换航点时的停顿等待时间（秒）
  wait_time: 0.0

  # 是否循环遍历发布所有目标点
  loop_navigation: false

  # 主循环检查与发布频率（Hz）
  control_rate: 20.0

# 交互与控制话题接口（内部解耦通信）
control:
  command_topic: "/waypoint_recorder/command"
  status_topic: "/waypoint_recorder/status"
  marker_topic: "/waypoint_recorder/markers"

# 航点持久化存储文件默认路径（可在 launch 文件或参数中覆盖）
storage:
  default_file_path: ""
